<div class="overflow-hidden rounded-2xl border border-emerald-400/25 bg-gradient-to-br from-emerald-500/15 via-white/[0.03] to-transparent p-5 shadow-xl shadow-emerald-950/40 sm:p-6">
  <div class="flex items-center gap-3">
    <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-gradient-to-br from-emerald-400 to-teal-500 shadow-lg shadow-emerald-500/40">
      <svg class="h-5 w-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="20 6 9 17 4 12" />
      </svg>
    </span>
    <div class="min-w-0">
      <p class="text-sm font-semibold text-emerald-300">Deine Kurz-URL ist fertig!</p>
      <p class="text-xs text-slate-400">Erstellt am {{ createdLabel }}</p>
    </div>
  </div>

  <div class="mt-4 flex flex-col gap-2.5 sm:flex-row sm:items-stretch">
    <code class="flex min-w-0 flex-1 items-center rounded-xl border border-white/10 bg-night/70 px-4 py-3">
      <a
        [href]="absoluteUrl"
        target="_blank"
        rel="noopener"
        class="break-all font-mono text-sm text-emerald-100 underline decoration-emerald-400/40 underline-offset-4 transition hover:decoration-emerald-300 sm:text-[15px]"
      >
        {{ absoluteUrl }}
      </a>
    </code>
    <button
      type="button"
      (click)="copy()"
      class="inline-flex shrink-0 items-center justify-center gap-2 rounded-xl border border-emerald-400/40 bg-emerald-500/10 px-5 text-sm font-semibold text-emerald-200 transition duration-200 hover:bg-emerald-500/20 active:scale-[0.98]"
    >
      @if (copied()) {
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="20 6 9 17 4 12" />
        </svg>
        Kopiert!
      } @else {
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
        </svg>
        Kopieren
      }
    </button>
  </div>

  <p class="mt-3 text-xs text-slate-500">Gültig bis {{ expiryLabel }}</p>
</div>
