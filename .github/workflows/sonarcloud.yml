# Quality and security analysis with SonarCloud (bugs, vulnerabilities,
# security hotspots, code smells) for both stacks.
# See docs/code-analysis-and-security.md for the one-time setup and the
# process for handling findings.
name: SonarCloud

on:
  push:
    branches: [main, master]
  pull_request:

# Allows the action to report the quality gate status on pull requests.
permissions:
  pull-requests: write

jobs:
  sonarcloud:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    # Stays inactive until the SONAR_TOKEN secret has been configured
    # (see docs/code-analysis-and-security.md, section "SonarCloud").
    if: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so SonarCloud can compute new-code metrics on PRs.
          fetch-depth: 0

      - name: SonarCloud scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=REPLACE_WITH_YOUR_ORGANIZATION_KEY
            -Dsonar.projectKey=REPLACE_WITH_YOUR_PROJECT_KEY
            -Dsonar.sources=shorty_backend/shorty_backend,shorty_frontend/src
            -Dsonar.tests=shorty_backend/shorty_backend.Tests,shorty_backend/shorty_backend.IntegrationTests
            -Dsonar.exclusions=**/migrations/**
