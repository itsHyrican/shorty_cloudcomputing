name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detects which part of the repo changed so the matching test job runs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - "shorty_frontend/**"
              - ".github/workflows/ci.yml"
            backend:
              - "shorty_backend/**"
              - ".github/workflows/ci.yml"

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shorty_frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: shorty_frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx ng test --watch=false

      - name: Production build
        run: npx ng build

  backend-unit-tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore shorty_backend/shorty_backend.sln

      - name: Build
        run: dotnet build shorty_backend/shorty_backend.sln --no-restore -c Release

      - name: Run unit tests
        run: dotnet test shorty_backend/shorty_backend.Tests --no-build -c Release --verbosity normal

  backend-integration-tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore shorty_backend/shorty_backend.sln

      - name: Build
        run: dotnet build shorty_backend/shorty_backend.sln --no-restore -c Release

      # Boots the full API against a real PostgreSQL container via Testcontainers;
      # Docker is preinstalled on the runner.
      - name: Run integration tests
        run: dotnet test shorty_backend/shorty_backend.IntegrationTests --no-build -c Release --verbosity normal
