name: CI

on:
  push:
    branches: [main, master]
    paths:
      - "shorty_backend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "shorty_backend/**"
      - ".github/workflows/ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore shorty_backend/shorty_backend.sln

      - name: Build
        run: dotnet build shorty_backend/shorty_backend.sln --no-restore -c Release

      - name: Run unit tests
        run: dotnet test shorty_backend/shorty_backend.sln --no-build -c Release --verbosity normal
